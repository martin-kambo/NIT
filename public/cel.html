/* shell */
function render(){const h=(location.hash.slice(2)||'').split('/'),p=h[0]||(S.role?home():'landing');
 if(!S.role&&p!='landing'&&p!='investor'){location.hash='#/landing';return}
 if(p=='landing'||p=='investor'){$('#app').innerHTML=V[p]();return}
 const v=V[p]?V[p](h[1]):V[home()]();
 $('#app').innerHTML=`<div class="shell"><aside><div class="brand">eTaifa Link<small>Kiambu County — CEL Concept</small></div>${nav().map(n=>`<a tabindex="0" role="link" class="${n[0]==p||(p=='apply'&&n[0]=='services')||(p=='track'&&n[0]=='apps')?'on':''}" data-go="${n[0]}">${n[1]}${TG[n[0]]?`<span class="tg ${TG[n[0]]=='NEW'?'':'n'}">${TG[n[0]]}</span>`:''}</a>`).join('')}${S.embed?'':'<a data-go="investor" style="margin-top:12px">Investor overview</a><a data-go="landing">← Exit to landing</a>'}<div class="leg">NIT = live in Ngoliba InfoTrack today<br>NEW = added by CEL</div></aside>
 <div class="main"><div class="top"><span class="demo">COMMING SOON !!</span><input type="search" placeholder="Search services, notices, references" aria-label="Search"><label for="rs" class="mu" style="margin:0">Role</label><select id="rs" data-a="role">${Object.entries(ROLES).map(r=>`<option value="${r[0]}" ${r[0]==S.role?'selected':''}>${r[1]}</option>`).join('')}</select><button class="bell" data-a="bell" aria-label="Notifications">🔔<b>${S.notifs.length}</b></button><div class="av" title="Martin Kambo">MK</div>
 ${S.open?`<div class="pan" role="dialog" aria-label="Notifications">${S.notifs.map(n=>`<div>🔔 ${n}</div>`).join('')}</div>`:''}</div><div class="page">${v}</div></div></div>`}
const A={
 login(v){S.role=v;location.hash='#/'+(v=='admin'?'analytics':'dash')},
 role(v,el){S.role=el.value;S.open=false;location.hash='#/'+home()},
 start(i){if(i==6){toast('Additional services: demo catalogue');return}S.svc=+i;S.step=1;S.files=[];location.hash='#/apply'},
 next(){if(S.step==2&&S.files.length<2){toast('Attach at least 2 documents to continue');return}S.step++;render()},
 back(){S.step--;render()},
 upl(i){S.files.push(+i);render()},uplall(){S.files=[0,1,2,3];render()},
 submit(){S.ref='eTL-2026-'+(5421+S.apps.filter(a=>!a.seed).length);const bu=S.svc==5;S.apps.unshift({r:S.ref,s:SV[S.svc][0],st:'Under Review',d:'30 Sep 2026',who:'Martin Kambo',off:'J. Wanjiru'});
